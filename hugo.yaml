baseURL: "https://morethanmaterial.org/"
locale: en-us
title: "More Than Material"
theme: ["PaperMod"]

copyright: "© 2026 More Than Material. Original written content licensed under CC BY 4.0 unless otherwise noted."

enableRobotsTXT: true
enableEmoji: true
enableInlineShortcodes: true

buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

caches:
  images:
    dir: :cacheDir/images

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  type: types
  category: categories
  topic: topics
  tag: tags
  series: series


markup:
  goldmark:
    extensions:
      extras:
        mark:
          enable: true
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: github

params:
  env: production
  title: "More Than Material"
  description: "Making the Christian case that reality is more than material."
  author: "More Than Material"

  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  disableSpecial1stPost: true

  mainSections:
    - posts

  profileMode:
    enabled: false

  homeInfoParams:
    Title: "More Than Material"
    Content: >
      Exploring reality, meaning, and the God behind it all.

  # Homepage featured video. Leave image empty to show the red placeholder.
  homeVideo:
    image: ""
    duration: "15:42"
    title: "Does Consciousness Require More?"
    description: "Exploring why consciousness points to more than material processes."
    link: "https://youtube.com/@morethanmaterial"

  homeQuote:
    quote: "To illuminate for everyone the stewardship of this mystery, which for ages past was kept hidden in God, who created all things"
    reference: "Ephesians 3:9, Berean Standard Bible"

  ShowReadingTime: false
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowWordCount: false

  comments: false

  assets:
    disableHLJS: true
    # Add these later after you create favicon files:
    # favicon: "/favicon.ico"
    # favicon16x16: "/favicon-16x16.png"
    # favicon32x32: "/favicon-32x32.png"
    # apple_touch_icon: "/apple-touch-icon.png"

  label:
    text: "More Than Material"

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false
    responsiveImages: true

  fuseOpts:
    isCaseSensitive: false
    includeMatches: true
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 2
    keys:
      - title
      - permalink
      - summary
      - content
      - types
      - categories
      - topics

privacy:
  youtube:
    privacyEnhanced: true

services:
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true

menu:
  main:
    - identifier: gospel
      name: Gospel
      url: /gospel/
      weight: 10
      params:
        class: menu-button menu-button-gospel

    - identifier: explore
      name: Explore
      url: ""
      weight: 20

    - identifier: explore-articles
      parent: explore
      name: Articles
      url: /types/article/
      weight: 10

    - identifier: explore-videos
      parent: explore
      name: Videos
      url: /types/video/
      weight: 15

    - identifier: explore-resources
      parent: explore
      name: Resources
      url: /resources/
      weight: 20

    - identifier: explore-archive
      parent: explore
      name: Archive
      url: /archives/
      weight: 25

    - identifier: explore-categories
      parent: explore
      name: Categories
      url: /categories/
      weight: 30

    - identifier: explore-topics
      parent: explore
      name: Topics
      url: /topics/
      weight: 40

    - identifier: community
      name: Community
      url: /community/
      weight: 35

    - identifier: search
      name: Search
      url: /search/
      weight: 40

    - identifier: about
      name: About
      url: /about/
      weight: 50

    - identifier: support
      name: Support
      url: /support/
      weight: 60
      params:
        class: menu-button menu-button-support
