<script>
(function () {
  var root = document.documentElement;
  var pending = {
    rough: true,
    notation: true
  };

  root.classList.add("mtm-effects-booting", "mtm-effects-no-transition", "mtm-rough-booting", "mtm-notation-booting");

  function reveal() {
    root.classList.remove("mtm-effects-booting", "mtm-rough-booting", "mtm-notation-booting");
    root.classList.add("mtm-effects-ready");

    window.requestAnimationFrame(function () {
      window.setTimeout(function () {
        root.classList.remove("mtm-effects-no-transition");
      }, 80);
    });
  }

  window.mtmMarkEffectReady = function (name) {
    if (name && Object.prototype.hasOwnProperty.call(pending, name)) {
      pending[name] = false;
      root.classList.remove("mtm-" + name + "-booting");
    }

    if (!pending.rough && !pending.notation) {
      reveal();
    }
  };

  window.setTimeout(reveal, 1800);
})();
</script>

<style>
html.mtm-effects-booting body {
  opacity: 0 !important;
}

html.mtm-effects-no-transition *,
html.mtm-effects-no-transition *::before,
html.mtm-effects-no-transition *::after {
  transition: none !important;
}
</style>

<script>
(function () {
  var CHOICE_KEY = "mtm-theme-choice";

  function systemWantsDark() {
    return window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: dark)").matches;
  }

  function getChoice() {
    try {
      return localStorage.getItem(CHOICE_KEY);
    } catch (error) {
      return null;
    }
  }

  function applyEarly(isDark) {
    document.documentElement.classList.toggle("dark", isDark);
    document.documentElement.classList.toggle("mtm-dark", isDark);
    document.documentElement.style.colorScheme = isDark ? "dark" : "light";
  }

  /*
    Ignore older broken theme keys from previous attempts.
    Only mtm-theme-choice counts now.
  */
  var choice = getChoice();
  var isDark = choice === "dark" || (!choice && systemWantsDark());

  try {
    if (!choice) {
      localStorage.removeItem("pref-theme");
      localStorage.removeItem("mtm-theme-manual");
    } else {
      localStorage.setItem("pref-theme", choice);
    }
  } catch (error) {}

  applyEarly(isDark);

  document.addEventListener("DOMContentLoaded", function () {
    document.body.classList.toggle("dark", isDark);
  });
})();
</script>

<style>
html.mtm-dark,
html.mtm-dark body {
  background: #14171a !important;
  color: #ffffff !important;
}
</style>
